<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d3f5d7">
  <title>剝藥責任區查詢</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400..800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js?v=3" defer></script>
</head>
<body>
  <main class="page">
    <header class="banner"><h1>剝藥責任區</h1></header>

    <section class="search-panel" aria-label="代號查詢">
      <label for="owner-select">選擇代號-負責人</label>
      <select id="owner-select" disabled>
        <option value="">載入中…</option>
      </select>
      <label for="code-input">輸入負責代號</label>
      <input id="code-input" type="text" value="1" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="code-hint">
      <p id="code-hint" class="hint">可輸入 1、01 或 D1；選單與輸入框會同步。</p>
    </section>

    <section class="results" aria-labelledby="results-title">
      <div class="meta">
        <p class="update-note">每週三晚更新</p>
        <p>資料區間：<strong id="data-period"></strong></p>
      </div>
      <div class="result-heading">
        <h2 id="results-title">查詢結果</h2>
        <span id="result-count" class="count"></span>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">資料載入中…</p>
      <div id="table-wrap" class="table-wrap" hidden>
        <table>
          <thead>
            <tr><th scope="col">機號－藥盒</th><th scope="col">藥名</th><th scope="col">代號</th><th scope="col">週耗量</th><th scope="col">負責人</th></tr>
          </thead>
          <tbody id="result-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
